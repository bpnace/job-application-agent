name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install locked project
        run: uv sync --frozen --all-groups
      - name: Verify license and package metadata
        run: |
          test -s LICENSE
          grep -F "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE
          uv run python -c "from importlib.metadata import metadata; assert metadata('job-application-agent')['License-Expression'] == 'AGPL-3.0-only'"
          uv build
      - name: Verify private state is never tracked
        run: uv run python scripts/check_public_repo.py --ref HEAD --history
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run python -m pyright
      - name: Install matching Chromium
        run: uv run python -m playwright install --with-deps chromium
      - name: Full test suite
        run: uv run python -m pytest
      - name: Browser fixture smoke
        run: uv run python -m pytest tests/test_browser_apply.py::test_local_browser_fixture_captures_final_submit_evidence
