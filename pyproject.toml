[project]
name = "job-application-agent"
version = "0.3.1"
description = "Privacy-first German job search and controlled public-form application CLI."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.2",
    "ipykernel>=6.29.5",
    "jinja2>=3.1.4",
    "jupyterlab>=4.3.0",
    "lxml>=5.3.0",
    "openai-agents>=0.3.0",
    "playwright>=1.49.0",
    "pypdf>=5.0.0",
    "pydantic>=2.10.0",
    "pytest>=8.3.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "reportlab>=4.2.5",
]

[project.scripts]
job-agent = "job_application_agent.cli:main"

[project.optional-dependencies]
scraping = [
    "scrapling>=0.4.8,<0.5",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
include = ["job_application_agent", "tests"]
exclude = ["runs"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.15",
]
